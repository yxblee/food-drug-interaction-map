id: "a-meal--lovastatin"
food: "a-meal"
drug: "lovastatin"
summary: "More of the active drug reaches the blood when lovastatin is taken with a meal than when it is taken fasting."
advice: "The lovastatin label says the tablets are given with meals, and reports that blood levels of the active inhibitors were about two-thirds as high when it was taken fasting as after a standard meal. Ask your pharmacist how this applies to your own dose."
