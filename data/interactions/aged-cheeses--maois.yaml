id: aged-cheeses--maois
food: aged-cheeses
drug: maois
mechanisms: [tyramine-pressor-response]
severity: avoid
effect: increases
summary: "Aged cheese is high in tyramine and can cause a dangerous rise in blood pressure with MAO inhibitors."
advice: "Avoid aged and strong cheeses. Fresh cheeses such as cottage and cream cheese are generally allowed, but check with your prescriber."
details: "Tyramine is normally broken down by monoamine oxidase in the gut and liver. While that enzyme is blocked, tyramine from food builds up and triggers a release of norepinephrine, which can raise blood pressure sharply (hypertensive crisis). The risk continues for about two weeks after the medicine is stopped, so keep following the diet during that time.\n\nThe labels for phenelzine, tranylcypromine and isocarboxazid all tell patients to avoid cheese, especially aged varieties."
