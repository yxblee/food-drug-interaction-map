id: "a-meal--levothyroxine"
food: "a-meal"
drug: "levothyroxine"
mechanisms: ["reduced-absorption"]
severity: "caution"
effect: "decreases"
summary: "Taking levothyroxine with a meal can lower how much is absorbed."
advice: "Take levothyroxine on an empty stomach, 30 to 60 minutes before breakfast, with water. Keep the timing steady so thyroid tests stay comparable, and ask your pharmacist how this applies to your own dose."
details: "The Synthroid label says to take it as a single daily dose on an empty stomach, one-half to one hour before breakfast. It notes that fasting increases absorption and that certain foods decrease it."
