id: coffee--oxygen
food: coffee
drug: oxygen
mechanisms:
  - adenosine-receptor-antagonism
severity: minimal
effect: decreases
summary: In young rodents, caffeine lessened the harm caused by breathing high
  concentrations of oxygen, protecting developing brain cells and the retina.
advice: This is a preclinical finding and no reason to change your coffee
  habits. Oxygen therapy, especially for premature infants, should follow
  medical guidance. Any caffeine given to infants is a prescribed treatment, not
  a dietary choice.
details: In neonatal rats and mice exposed to excess oxygen, caffeine given
  beforehand reduced nerve-cell death and loss of new neurons, and it lowered
  the damage to retinal blood vessels. The retinal protection depended partly on
  blocking adenosine A2A receptors, and an antioxidant action was also proposed.
  In healthy adults, caffeine also raised peak oxygen uptake and ventilation
  during exercise. These are effects on the body's handling of oxygen, not a
  hazardous interaction. So caffeine appears to reduce the toxic effects of
  high-dose oxygen rather than strengthen oxygen's benefits.
