id: grapefruit--ranolazine
food: grapefruit
drug: ranolazine
mechanisms:
  - cyp3a4-inhibition
severity: caution
effect: increases
summary: Grapefruit can raise ranolazine blood levels by blocking the CYP3A
  enzyme that breaks it down.
advice: Limit grapefruit juice and grapefruit-containing products while taking
  ranolazine. If you do consume them, tell your doctor. The ranolazine dose
  should not exceed 500 mg twice daily in that case.
details: Ranolazine is broken down mainly by CYP3A in the gut and liver. The
  label groups grapefruit juice and grapefruit products with moderate CYP3A
  inhibitors such as diltiazem, verapamil and erythromycin. These can increase
  ranolazine exposure. Higher levels raise the risk of side effects such as
  dizziness and QT interval prolongation. The label caps the dose at 500 mg
  twice daily for patients on moderate CYP3A inhibitors. The patient information
  tells people to avoid grapefruit and grapefruit juice, and to limit products
  that contain grapefruit.
