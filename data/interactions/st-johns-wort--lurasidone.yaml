id: st-johns-wort--lurasidone
food: st-johns-wort
drug: lurasidone
mechanisms:
  - cyp3a4-induction
severity: avoid
effect: decreases
summary: St. John's wort speeds up lurasidone breakdown, lowering its levels and
  effect. The label says not to combine them.
advice: Don't take St. John's wort with lurasidone. If you already use it, tell
  your prescriber or pharmacist. Don't stop or start either one without their
  advice.
details: The label names St. John's wort as an example of a strong CYP3A4
  inducer. Lurasidone is cleared mainly by the CYP3A4 enzyme. Strong inducers
  raise the activity of this enzyme, so less lurasidone stays in the body. Lower
  exposure could make the medicine work less well for schizophrenia or bipolar
  depression. For this reason the label says strong CYP3A4 inducers should not
  be used with lurasidone, and it lists this as a contraindication.
