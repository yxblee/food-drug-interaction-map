id: dairy--ferrous-sulfate
food: dairy
drug: ferrous-sulfate
mechanisms: [reduced-absorption]
severity: monitor
effect: decreases
summary: "Milk and dairy may lower iron absorption from supplements."
advice: "Take iron apart from milk or dairy foods where practical."
details: "A review reports substantial drops in iron availability when dairy is taken with iron solutions, but little effect when added to complex meals. A second review lists calcium among inhibitors, hence monitor rather than caution."
