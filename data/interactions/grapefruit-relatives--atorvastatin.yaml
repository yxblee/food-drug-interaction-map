id: grapefruit-relatives--atorvastatin
food: grapefruit-relatives
drug: atorvastatin
mechanisms: [cyp3a4-inhibition]
severity: caution
effect: increases
summary: "Large amounts of grapefruit juice can raise atorvastatin levels and the risk of muscle problems."
advice: "Avoid drinking large quantities of grapefruit juice (more than about 1.2 litres a day). Small amounts are less of a concern, but ask your pharmacist if you have it regularly."
details: "Grapefruit, pomelo and Seville orange contain furanocoumarins that switch off CYP3A4 in the gut wall, so more of the medicine is absorbed. Sweet oranges do not contain these compounds and are not part of this warning.\n\nThe Lipitor label ties the risk mainly to excessive intake, more than 1.2 litres a day, and advises avoiding large quantities."
