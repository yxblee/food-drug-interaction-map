id: alcohol--naltrexone
food: alcohol
drug: naltrexone
mechanisms:
  - cns-depression
severity: caution
effect: increases
summary: Naltrexone blunts alcohol's rewarding effects and can make drinking
  feel more sedating, dizzying or nauseating.
advice: Don't treat naltrexone as permission to drink. If you do drink while
  taking it, expect stronger sedation, dizziness or nausea, and avoid driving or
  risky tasks. Discuss alcohol use with your prescriber.
details: In controlled studies of social and heavy drinkers, taking naltrexone
  (50-100 mg daily) reduced the urge to drink and the liking of alcohol. After
  drinking, people reported more sedation, dizziness, nausea and feeling unwell,
  and less mood elevation. One study also found lower blood alcohol levels at
  the end of a drinking session, and naltrexone delayed the first sips. The
  effect comes from blocking opioid receptors involved in alcohol reward, which
  is why naltrexone is used to reduce drinking. Overall, alcohol feels less
  pleasant and more sedating, but drunkenness was generally not reduced.
