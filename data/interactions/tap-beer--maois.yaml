id: tap-beer--maois
food: tap-beer
drug: maois
mechanisms: [tyramine-pressor-response]
severity: avoid
effect: increases
summary: "Tap beer and unpasteurized beer can contain enough tyramine to cause a blood pressure crisis with MAO inhibitors."
advice: "Avoid tap or draft beer and beer that has not been pasteurized. Ask your prescriber about alcohol in general, because the labels advise against combining it with these medicines."
details: "Tyramine is normally broken down by monoamine oxidase in the gut and liver. While that enzyme is blocked, tyramine from food builds up and triggers a release of norepinephrine, which can raise blood pressure sharply (hypertensive crisis). The risk continues for about two weeks after the medicine is stopped, so keep following the diet during that time.\n\nThe tranylcypromine label lists all kinds of tap beer and unpasteurized beer among foods to avoid and notes that bottled and canned beer contains little or no tyramine. The phenelzine and isocarboxazid labels also tell patients to avoid beer."
