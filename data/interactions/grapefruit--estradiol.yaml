id: grapefruit--estradiol
food: grapefruit
drug: estradiol
mechanisms:
  - cyp3a4-inhibition
severity: monitor
effect: increases
summary: Grapefruit juice may raise estradiol levels by slowing its breakdown by
  CYP3A4, which could cause more side effects.
advice: Tell your doctor or pharmacist if you regularly drink grapefruit juice
  while using this estradiol product. Report any new or worsening
  estrogen-related side effects.
details: Estrogens are partly broken down by the CYP3A4 enzyme. The label groups
  grapefruit juice with CYP3A4 inhibitors such as erythromycin and ketoconazole.
  These may raise estrogen blood levels and lead to side effects. No formal
  interaction studies were done with this product. The vaginal ring gives lower
  systemic exposure than oral estrogens, so the real-world size of the effect is
  unclear.
