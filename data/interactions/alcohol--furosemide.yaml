id: alcohol--furosemide
food: alcohol
drug: furosemide
mechanisms: [additive-blood-pressure-lowering]
severity: caution
effect: increases
summary: "Alcohol can worsen dizziness or fainting on standing up while taking furosemide."
advice: "Be careful with alcohol while taking furosemide. Get up slowly, and tell your prescriber if you feel dizzy or faint."
details: "The Lasix label says low blood pressure on standing up may occur and be made worse by alcohol. The MedlinePlus furosemide page says alcohol can add to dizziness, lightheadedness and fainting on getting up."
