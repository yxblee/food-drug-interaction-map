id: calcium-supplements--tetracyclines
food: calcium-supplements
drug: tetracyclines
mechanisms: [chelation]
severity: caution
effect: decreases
summary: "Calcium products can bind tetracycline antibiotics and weaken them."
advice: "Space tetracycline antibiotics away from calcium supplements and calcium-containing antacids, following your pharmacist's timing advice."
details: "The tetracycline label states that absorption is impaired by antacids containing aluminum, calcium or magnesium. The doxycycline label also notes reduced tetracycline absorption with calcium-containing foods."
