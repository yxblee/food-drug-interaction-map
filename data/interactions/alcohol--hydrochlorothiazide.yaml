id: alcohol--hydrochlorothiazide
food: alcohol
drug: hydrochlorothiazide
mechanisms: [additive-blood-pressure-lowering]
severity: caution
effect: increases
summary: "Alcohol can worsen dizziness or fainting on standing up while taking hydrochlorothiazide."
advice: "Be careful with alcohol while taking hydrochlorothiazide. Get up slowly, and tell your prescriber if you feel dizzy or faint."
details: "The Inzirqo label says low blood pressure, including on standing up, may be made worse by alcohol. The hydrochlorothiazide section of the Hyzaar (losartan and hydrochlorothiazide) label says alcohol may increase low blood pressure on standing. The MedlinePlus hydrochlorothiazide page says alcohol can add to dizziness, lightheadedness and fainting on getting up."
