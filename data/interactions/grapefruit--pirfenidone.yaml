id: grapefruit--pirfenidone
food: grapefruit
drug: pirfenidone
mechanisms:
  - reduced-absorption
severity: monitor
effect: decreases
summary: Grapefruit juice taken with pirfenidone lowered its peak blood level by
  about half, similar to taking it with food, with only a small drop in total
  exposure.
advice: Take pirfenidone consistently as directed, and ask your prescriber or
  pharmacist before regularly drinking grapefruit juice with doses. Pirfenidone
  is usually taken with food to reduce stomach upset, so follow that guidance.
details: In 12 healthy volunteers, pirfenidone 0.4 g taken with grapefruit juice
  had a peak concentration of about 5.8 mg/L, versus about 10.9 mg/L when
  fasted. Total exposure (AUC) fell only modestly and not significantly (24.4 vs
  26.2 mg·h/L). Food produced a similar effect on peak levels. The authors
  suggest the large drop in peak concentration could matter for efficacy and
  safety. No adverse events occurred. The exact mechanism is not established;
  the data point to reduced or slower absorption rather than the enzyme
  inhibition typical of grapefruit.
citations:
  - type: study
    title: "Effect of grapefruit juice and food on the pharmacokinetics of
      pirfenidone in healthy Chinese volunteers: a diet-drug interaction study."
    url: https://pubmed.ncbi.nlm.nih.gov/26407124/
    pmid: "26407124"
status: pending
