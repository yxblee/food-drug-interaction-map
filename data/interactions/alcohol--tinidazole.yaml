id: alcohol--tinidazole
food: alcohol
drug: tinidazole
mechanisms: [disulfiram-like-reaction]
severity: avoid
effect: increases
summary: "Alcohol with tinidazole can cause stomach cramps, nausea, vomiting, headache and flushing."
advice: "Do not drink alcohol or use products containing ethanol or propylene glycol while taking tinidazole and for 3 days afterwards."
details: "The Tindamax label says alcoholic beverages and preparations containing ethanol or propylene glycol should be avoided during therapy and for 3 days afterwards because abdominal cramps, nausea, vomiting, headaches and flushing may occur. The MedlinePlus tinidazole page gives the same advice."
