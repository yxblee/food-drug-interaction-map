id: milk--iodine
food: milk
drug: iodine
mechanisms:
  - additive-dietary-intake
severity: minimal
effect: increases
summary: Milk naturally contains iodine, so regular milk intake raises your
  total iodine intake and status, which adds to any iodine supplement you take.
advice: If you take iodine supplements or iodine-containing medicines, count the
  iodine from milk and dairy toward your daily total. Stay under the upper
  intake limit, and ask your clinician about thyroid conditions.
details: Population survey data link frequent consumption of milk products with
  a lower chance of inadequate iodine intake in children and adults. Studies in
  dairy cows show that milk iodine rises with iodine in the animal's feed or
  with iodine injections. Goitrogens in feed, such as rapeseed glucosinolates,
  lower it. Milk can therefore be a large iodine source, and very high-iodine
  milk could push people above the tolerable upper intake level. The effect is
  additive dietary iodine, not a change in how the body handles iodine.
