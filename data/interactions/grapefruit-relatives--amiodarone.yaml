id: grapefruit-relatives--amiodarone
food: grapefruit-relatives
drug: amiodarone
mechanisms: [cyp3a4-inhibition]
severity: avoid
effect: increases
summary: "Grapefruit juice raises amiodarone exposure, and the label says to avoid it."
advice: "Avoid grapefruit and grapefruit juice while taking amiodarone."
details: "Grapefruit, pomelo and Seville orange contain furanocoumarins that switch off CYP3A4 in the gut wall, so more of the medicine is absorbed. Sweet oranges do not contain these compounds and are not part of this warning.\n\nThe Pacerone label reports that grapefruit juice raised amiodarone exposure by about 50% in healthy volunteers, lists it among CYP450 inhibitors to avoid, and tells patients to avoid it. Higher levels raise the chance of heart rhythm side effects."
