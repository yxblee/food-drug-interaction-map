id: st-johns-wort--ssris
food: st-johns-wort
drug: ssris
mechanisms: [serotonin-excess]
severity: caution
effect: increases
summary: "St. John's wort taken with an SSRI can push serotonin too high."
advice: "Do not add St. John's wort to an SSRI without your prescriber's agreement. Seek urgent care for agitation, fever, sweating, tremor or a racing heart."
details: "Both raise serotonin activity. The sertraline label names St. John's wort among the serotonergic products that raise the risk of serotonin syndrome, and NCCIH warns the combination may increase serotonin-related side effects that can be serious."
