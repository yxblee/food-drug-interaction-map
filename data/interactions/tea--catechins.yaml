id: tea--catechins
food: tea
drug: catechins
mechanisms:
  - amino-acid-transport-competition
severity: minimal
effect: increases
summary: Caffeine and amino acids naturally present in tea (theanine, serine,
  glycine) may raise how much of the tea catechins gets absorbed.
advice: No change is needed for ordinary tea drinking. Catechins in whole tea
  may be absorbed better than catechins taken alone, so keep this in mind when
  comparing tea with purified catechin supplements.
details: In a Caco-2 intestinal cell model, catechins such as EGCG, ECG and EC
  were actively pumped back out of cells. Catechins also raised the levels of
  the efflux pumps P-glycoprotein and MRP2. Adding caffeine or the amino acids
  theanine, serine or glycine lowered pump levels and efflux. Passage across the
  cell layer rose several-fold. This suggests that other components of tea may
  improve catechin absorption. The evidence comes from cell experiments only,
  not from people.
