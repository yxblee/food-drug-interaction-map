id: licorice--furosemide
food: licorice
drug: furosemide
mechanisms: [additive-potassium-loss]
severity: caution
effect: increases
summary: "Large amounts of real licorice can add to the potassium loss furosemide causes."
advice: "Avoid eating large amounts of black licorice or licorice products while taking furosemide, and tell your prescriber if you eat it."
details: "The Lasix label says low potassium may develop with it, including during use of licorice in large amounts. A review of licorice toxicity says thiazide and loop diuretics increase the risk of severe low potassium."
