id: coffee--levothyroxine
food: coffee
drug: levothyroxine
mechanisms: [reduced-absorption]
severity: monitor
effect: decreases
summary: "Drinking coffee close to levothyroxine may lower how much is absorbed."
advice: "Take levothyroxine with water on an empty stomach and leave a gap before coffee. Keep your routine steady so thyroid tests stay comparable."
details: "A systematic review found limited evidence that coffee taken with levothyroxine reduces its absorption. Evidence is thin, so this is graded as something to be aware of and to keep consistent."
