id: tea--ferrous-sulfate
food: tea
drug: ferrous-sulfate
mechanisms: [reduced-absorption]
severity: caution
effect: decreases
summary: "Tea taken with iron pills can reduce how much iron you absorb."
advice: "Take iron at least an hour away from tea."
details: "A review of dietary factors names tea polyphenols as inhibitors of iron absorption, with specific attention to tea. A second review lists polyphenols among factors that influence absorption in single-meal studies."
