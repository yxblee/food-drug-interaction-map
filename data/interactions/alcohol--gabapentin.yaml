id: alcohol--gabapentin
food: alcohol
drug: gabapentin
mechanisms: [cns-depression]
severity: caution
effect: increases
summary: "Alcohol can make the drowsiness and dizziness from gabapentin worse."
advice: "Do not drink alcohol while taking gabapentin without first talking with your healthcare provider, and do not drive or use heavy machinery until you know how it affects you."
details: "The Neurontin Medication Guide says not to drink alcohol or take other medicines that cause sleepiness or dizziness without first talking with a healthcare provider, because the combination may make sleepiness or dizziness worse. The MedlinePlus gabapentin page also says alcohol can add to the drowsiness the medicine causes."
