id: alcohol--acetaminophen
food: alcohol
drug: acetaminophen
mechanisms: [cyp2e1-toxic-metabolite]
severity: caution
effect: increases
summary: "Regular heavy drinking with acetaminophen raises the risk of liver damage."
advice: "If you have 3 or more alcoholic drinks a day, ask a doctor before using acetaminophen and never exceed the labelled daily limit."
details: "The over-the-counter label warns that severe liver damage may occur if you take acetaminophen while having three or more alcoholic drinks every day. The liver enzyme CYP2E1, which alcohol affects, helps form acetaminophen's toxic by-product."
