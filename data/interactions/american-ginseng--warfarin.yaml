id: american-ginseng--warfarin
food: american-ginseng
drug: warfarin
mechanisms: [reduced-warfarin-levels-unclear]
severity: caution
effect: decreases
summary: "American ginseng lowered warfarin's effect on INR in a small trial, so it may make warfarin work less well."
advice: "Tell the clinic that manages your warfarin before you start or stop American ginseng, and expect extra INR checks if you do. Keep the product and dose steady."
details: "In a randomized, placebo-controlled trial in 20 healthy volunteers, two weeks of American ginseng lowered peak INR and the blood levels of warfarin compared with placebo. The study was small and used healthy young people rather than patients on long-term warfarin. A 2008 American Family Physician review calls the research conflicting: American ginseng reduced warfarin levels, while Asian ginseng (a different plant) did not change warfarin's kinetics or dynamics. The review advises avoiding the combination if possible. This entry is about American ginseng only."
