id: coffee--lithium
food: coffee
drug: lithium
mechanisms: [increased-renal-clearance]
severity: monitor
effect: decreases
summary: "Caffeine can lower lithium levels, and cutting back suddenly can raise them."
advice: "Keep your coffee intake steady, and tell your prescriber before making a big change so lithium levels can be rechecked."
details: "The lithium label says xanthine preparations can lower serum lithium by increasing its excretion. A small study reported blood lithium rose when people stopped caffeine."
