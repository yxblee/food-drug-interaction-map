id: licorice--digoxin
food: licorice
drug: digoxin
mechanisms: [licorice-hypokalemia]
severity: caution
effect: increases
summary: "Real licorice can lower potassium, which makes digoxin toxicity more likely."
advice: "Avoid eating large or regular amounts of black licorice or licorice products while taking digoxin, and report palpitations or nausea."
details: "Two linked facts: a review of licorice toxicity describes hypokalemia from regular heavy intake, and the digoxin label lists hypokalemia as a predisposing factor for digoxin toxicity. No source cited here tests the pair directly; the link is drawn from these two."
