id: grapefruit-relatives--lovastatin
food: grapefruit-relatives
drug: lovastatin
mechanisms: [cyp3a4-inhibition]
severity: avoid
effect: increases
summary: "Grapefruit can raise lovastatin levels many times over and increase the risk of muscle damage."
advice: "Avoid grapefruit and grapefruit juice while taking lovastatin."
details: "Grapefruit, pomelo and Seville orange contain furanocoumarins that switch off CYP3A4 in the gut wall, so more of the medicine is absorbed. Sweet oranges do not contain these compounds and are not part of this warning.\n\nThe lovastatin label describes a study in which a large amount of grapefruit juice raised blood levels of lovastatin about 15-fold, and its interaction table says to avoid grapefruit juice. Higher levels raise the risk of myopathy and rhabdomyolysis."
