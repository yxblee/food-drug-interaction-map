id: "alcohol--caffeine"
food: "alcohol"
drug: "caffeine"
mechanisms: ["adenosine-receptor-antagonism"]
severity: "caution"
effect: "decreases"
summary: "Caffeine can mask alcohol's drowsiness, so you may feel more alert than you are while still impaired."
advice: "Don't rely on caffeine to sober up or to make driving or other risky tasks safe after drinking. Avoid mixing caffeinated drinks with alcohol."
details: "A review of caffeine and alcohol describes caffeine blocking the adenosine A1 receptors behind alcohol's sleep-inducing and unsteadying effects. This takes away the unwanted signals of intoxication, and simultaneous use has been linked to drinking more and more alcohol-related harm. Controlled trials found caffeine partly restored alertness but did not remove alcohol's overall performance deficits."
citations:
