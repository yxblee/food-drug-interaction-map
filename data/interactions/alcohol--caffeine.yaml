id: alcohol--caffeine
food: alcohol
drug: caffeine
mechanisms:
  - adenosine-receptor-antagonism
severity: caution
effect: decreases
summary: Caffeine can partly mask alcohol's drowsiness and slowing, but it does
  not remove alcohol's impairment of performance.
advice: Don't rely on coffee or caffeinated drinks to sober up or to make
  driving or other risky tasks safe after drinking. You may feel more alert
  while still being impaired.
details: In controlled trials in young adults, alcohol increased errors and
  slowed psychomotor speed, and lowered alertness. Caffeine (about 110-125 mg)
  partly countered the slowing on a digit-symbol task and weakly reduced errors
  on some tasks. A high caffeine dose restored subjective alertness. Caffeine
  did not fix the overall performance deficits caused by alcohol. The effects
  were largely independent, so a person may feel more awake than their actual
  performance warrants. One survey of young adolescents also linked daily
  caffeine use to starting alcohol, but that is an association and not a drug
  effect.
