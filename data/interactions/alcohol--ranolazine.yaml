id: alcohol--ranolazine
food: alcohol
drug: ranolazine
mechanisms:
  - alcohol-dose-dumping
severity: avoid
effect: increases
summary: Alcohol can make this extended-release ranolazine product release its
  drug too quickly, which may raise the risk of side effects.
advice: Don't drink alcohol (beer, wine or spirits) while taking this medicine.
  Ask your prescriber or pharmacist if you're unsure.
details: In a lab dissolution test, alcohol broke down the extended-release
  behavior of the granules. The drug came out rapidly instead of slowly over
  time. A faster release could push up ranolazine levels in the body and
  increase side effects. Ranolazine already causes dizziness and QT
  prolongation, so this matters. The label tells patients not to consume
  alcohol. The evidence comes from an in-vitro study, not a human trial.
