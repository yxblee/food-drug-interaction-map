id: grapefruit--colchicine
food: grapefruit
drug: colchicine
mechanisms:
  - cyp3a4-inhibition
severity: caution
effect: increases
summary: Drinking large amounts of grapefruit juice may raise colchicine levels
  and contribute to toxicity.
advice: If you take colchicine, avoid regularly drinking grapefruit juice or
  eating large amounts of grapefruit unless your prescriber agrees. Seek medical
  help for vomiting, diarrhea, weakness, or unusual bruising or infections.
details: A child with familial Mediterranean fever on preventive colchicine
  developed poisoning symptoms affecting the gut, nervous system, heart and
  blood after about two months of drinking lots of natural grapefruit juice. A
  viral respiratory infection was also present, so the juice was likely one of
  several contributors. Grapefruit juice can block the gut enzyme CYP3A4 that
  breaks down colchicine, so more of the drug reaches the bloodstream.
  Colchicine has a narrow safety margin, so even modest increases can cause
  serious toxicity.
citations:
  - type: study
    title: Near fatal acute colchicine intoxication in a child. A case report.
    url: https://pubmed.ncbi.nlm.nih.gov/11131346/
    pmid: "11131346"
status: pending
