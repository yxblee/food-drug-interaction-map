id: grapefruit--eplerenone
food: grapefruit
drug: eplerenone
mechanisms: [cyp3a4-inhibition]
severity: minimal
effect: increases
summary: "Grapefruit juice raised eplerenone levels by about a quarter."
advice: "Ask your doctor about eating grapefruit or drinking grapefruit juice while taking eplerenone."
details: "The Inspra label reports that grapefruit juice raised eplerenone exposure by 25% and gives no instruction about grapefruit. Its limits are for stronger CYP3A inhibitors: strong ones must not be used, and moderate ones, which raised exposure by 100% to 190%, need a lower dose. The MedlinePlus eplerenone page says to talk to your doctor about grapefruit and grapefruit juice."
