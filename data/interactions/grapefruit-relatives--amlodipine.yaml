id: grapefruit-relatives--amlodipine
food: grapefruit-relatives
drug: amlodipine
mechanisms: [cyp3a4-inhibition]
severity: minimal
effect: increases
summary: "Grapefruit juice has no measurable effect on amlodipine exposure."
advice: "No grapefruit restriction is needed for amlodipine itself."
details: "The Norvasc label says grapefruit juice does not change amlodipine exposure, even though amlodipine is processed partly by CYP3A. Other calcium channel blockers such as felodipine and nifedipine behave differently. The effect direction is shown as increases only for consistency with the enzyme mechanism."
