id: calcium-supplements--bisphosphonates
food: calcium-supplements
drug: bisphosphonates
mechanisms: [chelation]
severity: avoid
effect: decreases
summary: "Calcium supplements bind osteoporosis pills and block their absorption."
advice: "Take calcium supplements and antacids at a different time of day from the pill, following the wait on your label."
details: "The alendronate label says products containing calcium and other multivalent cations are likely to interfere with absorption. The risedronate label tells patients to take calcium supplements and antacids at a different time of day."
