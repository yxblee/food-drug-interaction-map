id: dairy--bisphosphonates
food: dairy
drug: bisphosphonates
mechanisms: [chelation]
severity: caution
effect: decreases
summary: "Milk and other dairy foods can interfere with osteoporosis pills."
advice: "Take the pill with plain water and wait the time on the label before milk, yogurt or cheese."
details: "The labels require plain water and a wait before any food or drink, and say calcium-containing products are likely to interfere with absorption. They do not name dairy specifically, so this is graded caution rather than avoid."
