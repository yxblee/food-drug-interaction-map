id: grapefruit-relatives--rosuvastatin
food: grapefruit-relatives
drug: rosuvastatin
mechanisms: [cyp3a4-inhibition]
severity: minimal
effect: increases
summary: "Rosuvastatin is not meaningfully affected by grapefruit."
advice: "No grapefruit restriction is needed for rosuvastatin itself. Check your other medicines, because many are affected."
details: "The rosuvastatin label states that its clearance does not depend to a clinically significant extent on CYP3A4, the enzyme grapefruit blocks. A review of grapefruit interactions lists rosuvastatin among statins that can be used without this problem. The effect direction is shown as increases only because that is the way grapefruit pushes drugs of this kind."
