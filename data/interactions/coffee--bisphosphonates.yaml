id: coffee--bisphosphonates
food: coffee
drug: bisphosphonates
mechanisms: [reduced-absorption]
severity: avoid
effect: decreases
summary: "Coffee taken with an osteoporosis pill can cut absorption by about 60%."
advice: "Take the pill with plain water only, and wait the time on the label before coffee or food."
details: "The alendronate label reports that taking it with coffee or orange juice reduced bioavailability by about 60%. The ibandronate label says to use plain water only, not coffee, tea, soda or juice, and to wait 60 minutes before other food or drink."
