id: orange-juice--bisphosphonates
food: orange-juice
drug: bisphosphonates
mechanisms: [reduced-absorption]
severity: avoid
effect: decreases
summary: "Orange juice taken with an osteoporosis pill can cut absorption by about 60%."
advice: "Take the pill with plain water only, and have juice later after the wait on the label."
details: "The alendronate label reports a bioavailability drop of about 60% when taken with coffee or orange juice, and the ibandronate label excludes juice when taking the tablet."
