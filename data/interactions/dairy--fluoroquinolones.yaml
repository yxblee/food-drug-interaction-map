id: dairy--fluoroquinolones
food: dairy
drug: fluoroquinolones
mechanisms: [chelation]
severity: caution
effect: decreases
summary: "Milk or yogurt on its own can reduce how much ciprofloxacin you absorb."
advice: "Avoid taking the antibiotic with milk, yogurt or calcium-fortified juice alone. Taking it with a full meal that includes them is acceptable."
details: "The ciprofloxacin label says to avoid taking it with dairy products or calcium-fortified juice alone because absorption may drop, while allowing it as part of a meal containing them."
