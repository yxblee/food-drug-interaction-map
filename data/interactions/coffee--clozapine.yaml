id: coffee--clozapine
food: coffee
drug: clozapine
mechanisms: [cyp1a2-competition]
severity: monitor
effect: increases
summary: "Caffeine can slow clozapine breakdown and raise its levels."
advice: "Keep your caffeine intake steady and tell your prescriber about large changes."
details: "The clozapine label lists caffeine as a weak or moderate CYP1A2 inhibitor and advises close monitoring with possible dose reduction when such inhibitors are used."
