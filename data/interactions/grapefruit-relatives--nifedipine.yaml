id: grapefruit-relatives--nifedipine
food: grapefruit-relatives
drug: nifedipine
mechanisms: [cyp3a4-inhibition]
severity: avoid
effect: increases
summary: "Grapefruit roughly doubles nifedipine levels, so the label advises avoiding it."
advice: "Avoid grapefruit and grapefruit juice while taking nifedipine."
details: "Grapefruit, pomelo and Seville orange contain furanocoumarins that switch off CYP3A4 in the gut wall, so more of the medicine is absorbed. Sweet oranges do not contain these compounds and are not part of this warning.\n\nThe Procardia XL label reports about a doubling of exposure with grapefruit juice, attributes it to blocked CYP3A4 first-pass metabolism, and says to avoid grapefruit and grapefruit juice. Higher levels can cause low blood pressure and swelling."
