id: iron-supplements--levodopa
food: iron-supplements
drug: levodopa
mechanisms: [chelation]
severity: caution
effect: decreases
summary: "Iron supplements may reduce how much levodopa the body absorbs, possibly by binding it in the gut."
advice: "Iron supplements and multivitamins with iron may interact with levodopa. Tell your pharmacist or prescriber about any iron product you take and ask how to space them."
details: "The NIH fact sheet says some evidence shows iron supplements reduce levodopa absorption in healthy people, possibly through chelation, and that US levodopa labels warn iron-containing supplements might lessen its effect."
