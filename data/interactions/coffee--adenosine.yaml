id: "coffee--adenosine"
food: "coffee"
drug: "adenosine"
mechanisms: ["adenosine-receptor-antagonism"]
severity: "caution"
effect: "decreases"
summary: "Caffeine from coffee blocks the receptors adenosine acts on, so adenosine may work less well or not at all."
advice: "Avoid coffee and other caffeine before a test or treatment that uses adenosine, following your care team's instructions. Tell staff if you had caffeine recently."
details: "The adenosine label states that methylxanthines such as caffeine antagonize adenosine, so larger doses may be needed or adenosine may not be effective. A study of stress perfusion imaging found that recent caffeine intake could invert adenosine's effect on myocardial blood flow."
