id: zinc-supplements--fluoroquinolones
food: zinc-supplements
drug: fluoroquinolones
mechanisms: [chelation]
severity: caution
effect: decreases
summary: "Zinc taken with quinolone antibiotics can reduce absorption of both the zinc and the antibiotic."
advice: "Take the antibiotic at least 2 hours before or 6 hours after zinc supplements, or antacids or multivitamins that contain zinc, unless your pharmacist advises otherwise."
details: "The NIH fact sheet says quinolones such as ciprofloxacin might interact with zinc in the gut, which could inhibit absorption of both if taken together, and that taking the antibiotic at least 2 hours before or 4 to 6 hours after the supplement minimizes this. The MedlinePlus ciprofloxacin page gives 6 hours after, for antacids and multivitamins containing zinc; the advice uses that longer gap."
citations:
