id: "a-meal--aliskiren"
food: "a-meal"
drug: "aliskiren"
mechanisms: ["reduced-absorption"]
severity: "monitor"
effect: "decreases"
summary: "A high-fat meal can sharply lower how much aliskiren is absorbed."
advice: "Take it the same way in relation to meals every day. Ask your pharmacist how this applies to your own dose."
details: "The Tekturna label says to keep a routine pattern with regard to meals. With a high-fat meal, aliskiren exposure (AUC) was 71% lower and peak level 85% lower."
