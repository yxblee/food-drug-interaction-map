id: grapefruit-relatives--cyclosporine
food: grapefruit-relatives
drug: cyclosporine
mechanisms: [cyp3a4-inhibition]
severity: avoid
effect: increases
summary: "Grapefruit raises cyclosporine levels and should be avoided."
advice: "Avoid grapefruit and grapefruit juice if you take cyclosporine, and take the medicine on a consistent schedule in relation to meals."
details: "Grapefruit, pomelo and Seville orange contain furanocoumarins that switch off CYP3A4 in the gut wall, so more of the medicine is absorbed. Sweet oranges do not contain these compounds and are not part of this warning.\n\nThe Neoral label states that grapefruit and grapefruit juice raise cyclosporine concentrations and should be avoided. Cyclosporine has a narrow safe range, so higher levels can damage the kidneys."
