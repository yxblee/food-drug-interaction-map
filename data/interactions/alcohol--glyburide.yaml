id: alcohol--glyburide
food: alcohol
drug: glyburide
mechanisms: [additive-hypoglycemia]
severity: caution
effect: increases
summary: "Low blood sugar is more likely if you drink alcohol while taking glyburide."
advice: "Be careful with alcohol while taking glyburide, ask your prescriber what is safe for you and know the signs of low blood sugar."
details: "The glyburide label says low blood sugar is more likely when alcohol is taken, when food intake is too low or after severe or prolonged exercise. In a study of 10 older adults with type 2 diabetes taking glyburide and fasting, alcohol given into a vein, in an amount like one or two drinks, led to lower blood sugar than placebo."
