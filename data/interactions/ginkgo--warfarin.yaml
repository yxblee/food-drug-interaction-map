id: ginkgo--warfarin
food: ginkgo
drug: warfarin
mechanisms: [possible-antiplatelet-effect]
severity: monitor
effect: increases
summary: "Ginkgo may raise bleeding risk with warfarin, but controlled studies have not shown an effect on warfarin itself."
advice: "Tell the clinic that manages your warfarin before you start or stop ginkgo, and report unusual bruising or bleeding. If you take it, keep the product and dose steady."
details: "NCCIH says ginkgo may increase the risk of bleeding in people taking anticoagulants such as warfarin. The evidence is mixed. A small crossover study in 12 healthy volunteers found that ginkgo at recommended doses did not change warfarin levels, INR or platelet aggregation, and a 2008 American Family Physician review notes that controlled studies show no effect on warfarin's kinetics or dynamics while experts still advise caution. A 2021 systematic review of warfarin and food, herb and supplement interactions still lists ginkgo among the products linked to bleeding. Because warfarin has a narrow safe range, it is worth telling your care team even though the evidence is unsettled."
