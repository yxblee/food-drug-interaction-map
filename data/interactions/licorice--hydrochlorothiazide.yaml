id: licorice--hydrochlorothiazide
food: licorice
drug: hydrochlorothiazide
mechanisms: [additive-potassium-loss]
severity: caution
effect: increases
summary: "Real licorice can add to the potassium loss hydrochlorothiazide causes."
advice: "Limit black licorice and licorice products while taking hydrochlorothiazide, and tell your prescriber if you eat them."
details: "The hydrochlorothiazide section of the Hyzaar (losartan and hydrochlorothiazide) label says glycyrrhizin, found in liquorice, intensifies electrolyte loss, particularly low potassium. A review says thiazide and loop diuretics increase the risk of severe low potassium. In a two-week trial in 10 healthy volunteers, potassium fell when 32 g of liquorice a day was taken with 25 mg hydrochlorothiazide, and 2 developed low potassium."
