id: calcium-fortified-juice--fluoroquinolones
food: calcium-fortified-juice
drug: fluoroquinolones
mechanisms: [chelation]
severity: caution
effect: decreases
summary: "Calcium-fortified juice on its own can reduce ciprofloxacin absorption."
advice: "Do not take the antibiotic with calcium-fortified juice alone. A meal that contains it is acceptable."
details: "The ciprofloxacin label names calcium-fortified juices alongside dairy as products to avoid when taken alone, because the calcium may lower absorption."
