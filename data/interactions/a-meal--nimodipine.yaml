id: "a-meal--nimodipine"
food: "a-meal"
drug: "nimodipine"
mechanisms: ["reduced-absorption"]
severity: "caution"
effect: "decreases"
summary: "A meal can sharply lower how much nimodipine reaches the blood."
advice: "Take it one hour before a meal or two hours after one. Ask your pharmacist how this applies to your own dose."
details: "The Nymalize label says to give it one hour before or two hours after a meal. After a standard breakfast, peak levels were 68% lower and bioavailability 38% lower than when fasting."
