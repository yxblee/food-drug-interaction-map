id: "coffee--acetaminophen"
food: "coffee"
drug: "acetaminophen"
mechanisms: ["adenosine-receptor-antagonism"]
severity: "minimal"
effect: "increases"
summary: "Caffeine, as in a cup of coffee, can slightly improve the pain relief from acetaminophen."
advice: "No need to avoid coffee with acetaminophen. Count coffee toward your total caffeine if you also take combination pain products that contain caffeine."
details: "A risk-benefit review pooled trials of acetaminophen 1,000 mg with caffeine 130 mg against acetaminophen alone. The combination gave a modestly higher chance of good pain relief (relative benefit 1.12) across headache, dental, period and post-partum pain. The review found no compelling evidence that caffeine meaningfully increases acetaminophen liver toxicity."
citations:
