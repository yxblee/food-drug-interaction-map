id: coffee--acetaminophen
food: coffee
drug: acetaminophen
mechanisms:
  - adenosine-receptor-antagonism
severity: monitor
effect: increases
summary: Caffeine speeds up acetaminophen absorption and boosts its pain relief,
  but at high doses it may worsen acetaminophen liver toxicity.
advice: Usual caffeine amounts from coffee or combination pain products are
  generally fine for adults. Avoid combining high-dose caffeine with large
  acetaminophen doses, and be especially careful in premature infants receiving
  caffeine for apnea, where clinicians should watch acetaminophen dosing.
details: In a human crossover study, 130 mg caffeine taken with 1000 mg
  acetaminophen led to faster early absorption of acetaminophen and stronger,
  longer-lasting pain relief than acetaminophen alone. Caffeine alone gave no
  meaningful analgesia. On the safety side, lab work with fetal-like liver cells
  and organoids showed high-dose caffeine made acetaminophen more damaging by
  dampening the cell's DNA-damage repair signalling (ATM), adding oxidative
  stress and mitochondrial injury; N-acetylcysteine reduced this. In rats,
  caffeine combined with theophylline and a large acetaminophen dose depleted
  liver glutathione and raised lipid peroxidation. These toxicity findings come
  from cell and animal models at high doses, so their relevance to ordinary
  coffee intake in adults is uncertain.
