id: potassium-salt-substitutes--spironolactone
food: potassium-salt-substitutes
drug: spironolactone
mechanisms: [additive-hyperkalemia]
severity: caution
effect: increases
summary: "Potassium-based salt substitutes can push potassium too high with spironolactone."
advice: "Ask your prescriber before using salt substitutes, and keep up regular potassium blood tests."
details: "Spironolactone holds potassium in the body. Its label says the hyperkalemia risk rises with potassium-containing salt substitutes and calls for regular potassium monitoring."
