id: fermented-vegetables--maois
food: fermented-vegetables
drug: maois
mechanisms: [tyramine-pressor-response]
severity: avoid
effect: increases
summary: "Sauerkraut and similar fermented vegetables are high in tyramine and unsafe with MAO inhibitors."
advice: "Avoid sauerkraut and other fermented or pickled vegetables, and check with your prescriber before eating foods such as kimchi."
details: "Tyramine is normally broken down by monoamine oxidase in the gut and liver. While that enzyme is blocked, tyramine from food builds up and triggers a release of norepinephrine, which can raise blood pressure sharply (hypertensive crisis). The risk continues for about two weeks after the medicine is stopped, so keep following the diet during that time.\n\nThe phenelzine, tranylcypromine and isocarboxazid labels all list sauerkraut among foods to avoid."
