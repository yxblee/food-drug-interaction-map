id: coffee--theophylline
food: coffee
drug: theophylline
mechanisms: [cyp1a2-competition, additive-stimulant]
severity: minimal
effect: increases
summary: "Normal coffee intake is not expected to change theophylline much, but caffeine adds to its jittery side effects."
advice: "Keep caffeine intake moderate and steady. Report tremor, a racing heart or nausea."
details: "The theophylline label lists dietary caffeine among items documented not to cause a clinically significant interaction, though both are processed by CYP1A2 and the label describes caffeine-like side effects of theophylline itself. Graded minimal on that basis; this is the one row where the proposed severity was lowered."
