id: fermented-soy--maois
food: fermented-soy
drug: maois
mechanisms: [tyramine-pressor-response]
severity: avoid
effect: increases
summary: "Soy sauce and other fermented soy foods can contain enough tyramine to be unsafe with MAO inhibitors."
advice: "Avoid soy sauce and other fermented soy products, and check with your prescriber before eating foods such as miso."
details: "Tyramine is normally broken down by monoamine oxidase in the gut and liver. While that enzyme is blocked, tyramine from food builds up and triggers a release of norepinephrine, which can raise blood pressure sharply (hypertensive crisis). The risk continues for about two weeks after the medicine is stopped, so keep following the diet during that time.\n\nThe tranylcypromine label lists most soybean products, including soy sauce, among tyramine-rich foods to avoid, and the isocarboxazid label lists soy sauce."
