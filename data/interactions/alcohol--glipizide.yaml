id: alcohol--glipizide
food: alcohol
drug: glipizide
mechanisms: [additive-hypoglycemia]
severity: avoid
effect: increases
summary: "Alcohol with glipizide can make low blood sugar more likely and change how well the medicine works."
advice: "Do not drink alcohol while taking extended-release glipizide (Glucotrol XL). If you take another form of glipizide, ask your prescriber about the safe use of alcohol."
details: "The Glucotrol XL patient information says not to drink alcohol while taking it because it can increase the chance of serious side effects. The same label says low blood sugar is more likely when alcohol is taken, and that alcohol may strengthen or weaken the glucose-lowering effect. In a study of 10 people without diabetes who took glipizide, alcohol did not deepen the fall in blood sugar but slowed its return toward the fasting level. The MedlinePlus glipizide page says to ask a doctor about the safe use of alcohol, that alcohol may make side effects worse and that it may rarely cause symptoms such as flushing, headache, nausea, vomiting, chest pain, mental confusion and breathing difficulty."
