id: iron-supplements--fluoroquinolones
food: iron-supplements
drug: fluoroquinolones
mechanisms: [chelation]
severity: caution
effect: decreases
summary: "Iron supplements can bind quinolone antibiotics in the gut so much less is absorbed."
advice: "Take the antibiotic at least 2 hours before or 6 hours after an iron supplement, unless your pharmacist gives different timing."
details: "The ciprofloxacin label says to take it at least 2 hours before or 6 hours after metal cations such as iron, and products containing calcium, iron or zinc. That timing comes from the ciprofloxacin label; other quinolones may differ. In a small study of healthy volunteers, ferrous sulfate (100 mg of iron) cut how much ciprofloxacin was absorbed by more than half (57%), norfloxacin by about three-quarters (73%) and ofloxacin by about a quarter (25%). Lower antibiotic levels could let an infection go untreated, so timing matters."
