id: iron-supplements--fluoroquinolones
food: iron-supplements
drug: fluoroquinolones
mechanisms: [chelation]
severity: caution
effect: decreases
summary: "Iron supplements can bind quinolone antibiotics in the gut so much less is absorbed."
advice: "Take the antibiotic at least 2 hours before or 6 hours after an iron supplement, unless your pharmacist gives different timing."
details: "The ciprofloxacin label says metal cations such as iron, and products containing calcium, iron or zinc, should be separated from the antibiotic by at least 2 hours before or 6 hours after. In 8 healthy volunteers, ferrous sulphate (100 mg of iron) lowered the total absorption (AUC) of ciprofloxacin by 57%, norfloxacin by 73% and ofloxacin by 25%. Lower antibiotic levels could let an infection go untreated, so timing matters."
