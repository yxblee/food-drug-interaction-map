summary: "Alcohol with opioid pain medicine can slow breathing dangerously."
advice: "Do not drink alcohol while taking opioid pain medicine."
details: "The oxycodone label warns that using opioids with central nervous system depressants, including alcohol, may cause profound sedation, respiratory depression, coma and death."
