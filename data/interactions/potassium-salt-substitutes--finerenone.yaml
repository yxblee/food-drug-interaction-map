id: potassium-salt-substitutes--finerenone
food: potassium-salt-substitutes
drug: finerenone
mechanisms: [additive-hyperkalemia]
severity: caution
effect: increases
summary: "Potassium-based salt substitutes can add to the risk of high potassium with finerenone."
advice: "Talk with your prescriber before using salt substitutes containing potassium, and keep up your potassium blood tests."
details: "The Kerendia label tells patients to consult their physician before using potassium supplements or salt substitutes containing potassium, and to have potassium checked periodically. The MedlinePlus finerenone page also says to talk to a doctor before using these salt substitutes."
