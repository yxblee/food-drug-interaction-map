id: grapefruit--itraconazole
food: grapefruit
drug: itraconazole
mechanisms:
  - reduced-absorption
severity: caution
effect: decreases
summary: Grapefruit juice lowered itraconazole levels from capsules by roughly
  40-50% and delayed peak levels.
advice: Don't count on grapefruit juice to boost itraconazole capsules; it may
  reduce absorption. Take the drug as directed and ask your pharmacist or doctor
  whether to avoid grapefruit juice around doses.
details: In eleven healthy volunteers, drinking grapefruit juice with
  itraconazole capsules cut the drug's overall exposure by about 43% and its
  active metabolite hydroxy-itraconazole by about 47%. Time to peak
  concentration was also later. Although grapefruit juice inhibits intestinal
  CYP3A4, which might be expected to raise levels, the observed effect was
  reduced absorption. The authors suggest the juice's acidity may be involved,
  since itraconazole capsules need stomach acid to absorb well. Lower levels
  could mean less antifungal effect.
citations:
  - type: study
    title: Grapefruit juice decreases the systemic availability of itraconazole
      capsules in healthy volunteers.
    url: https://pubmed.ncbi.nlm.nih.gov/10365642/
    pmid: "10365642"
status: pending
