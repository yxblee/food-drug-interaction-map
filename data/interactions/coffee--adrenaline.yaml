id: coffee--adrenaline
food: coffee
drug: adrenaline
mechanisms:
  - additive-stimulant
  - comt-inhibition-reduced-inactivation
severity: monitor
effect: increases
summary: Caffeine raises the body's own adrenaline levels and can strengthen the
  vascular effects of adrenaline by slowing its breakdown.
advice: Be cautious with large amounts of coffee or caffeine around adrenaline
  treatment, especially in people with heart disease, high blood pressure or
  rhythm problems. Tell your clinician about heavy caffeine use.
details: In human studies, a 5 mg/kg dose of caffeine increased circulating
  epinephrine, along with free fatty acids and lactate, so it adds to
  adrenaline's metabolic effects. In isolated rabbit aortic tissue, caffeine and
  theophylline made blood vessel contractions to adrenaline stronger, apparently
  by reducing its inactivation through O-methylation (COMT-type breakdown
  outside nerve endings). The tissue findings come from lab experiments, so the
  clinical size of the effect for injected adrenaline is uncertain.
