id: "a-meal--alendronate"
food: "a-meal"
drug: "alendronate"
mechanisms: ["reduced-absorption"]
severity: "avoid"
effect: "decreases"
summary: "Alendronate taken with food is barely absorbed, so it may not work."
advice: "Take it first thing in the day with plain water, at least 30 minutes before the first food, drink or medicine, and stay upright until after your first food. Ask your pharmacist about your own routine."
details: "The Fosamax label says taking it with food, or waiting less than 30 minutes, lessens its effect by decreasing absorption. Bioavailability was negligible when it was taken with a standardized breakfast."
