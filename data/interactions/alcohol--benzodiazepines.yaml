summary: "Alcohol adds to the sedating effect of benzodiazepines."
advice: "Do not drink alcohol while taking a benzodiazepine, and do not drive or use machinery until you know how it affects you."
details: "The alprazolam label advises patients to avoid alcohol and other central nervous system depressants during treatment because of their added CNS depressant effects."
