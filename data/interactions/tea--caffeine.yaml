id: tea--caffeine
food: tea
drug: caffeine
mechanisms:
  - reduced-absorption
severity: minimal
effect: decreases
summary: Tea polyphenols can bind caffeine and slow its absorption, but tea also
  raised blood pressure briefly more than caffeine alone.
advice: Count caffeine from tea along with other sources. People sensitive to
  blood pressure rises should be aware that strong tea can bump blood pressure
  for about 30 minutes. Regular tea drinking did not change 24-hour blood
  pressure in the study.
details: In mice, caffeine bound to oxidized tea polyphenols (as in fermented
  Pu-er tea) reached lower peak blood levels (about 26-33% lower) than caffeine
  from coffee. More caffeine was lost in the feces, and the stimulant effect on
  movement was weaker. In humans, green and black tea caused larger short-term
  blood pressure rises at 30 minutes than the same amount of caffeine in water,
  which had faded by 60 minutes. Five cups daily for a week did not
  significantly alter 24-hour blood pressure relative to caffeine.
