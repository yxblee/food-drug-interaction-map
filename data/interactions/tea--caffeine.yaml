id: "tea--caffeine"
food: "tea"
drug: "caffeine"
mechanisms: ["additive-stimulant"]
severity: "monitor"
effect: "increases"
summary: "Tea contains caffeine, which adds to the caffeine in this medicine and raises the chance of jitters, sleeplessness and a fast heartbeat."
advice: "Limit tea and other caffeinated foods, drinks or medicines while using this product. If you get nervousness, trouble sleeping or a racing heartbeat, cut back and ask a doctor or pharmacist."
details: "The caffeine label advises limiting caffeine-containing foods and beverages while taking the product, because too much caffeine may cause nervousness, irritability, sleeplessness and occasionally a rapid heartbeat. Both green and black tea contain caffeine."
