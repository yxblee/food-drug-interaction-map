id: aged-cheeses--isoniazid
food: aged-cheeses
drug: isoniazid
mechanisms: [tyramine-pressor-response]
severity: avoid
effect: increases
summary: "Isoniazid can block tyramine breakdown, so cheese may cause headache, flushing and blood pressure changes."
advice: "Avoid tyramine-rich foods such as aged cheese and red wine while taking isoniazid, as the label advises."
details: "The isoniazid label says tyramine- and histamine-containing foods should be avoided because the drug has some monoamine oxidase inhibiting activity, and gives cheese and red wine as examples. Its MAO inhibition is weaker than that of dedicated MAO inhibitor antidepressants, so reactions are less predictable, but the label still advises avoidance."
