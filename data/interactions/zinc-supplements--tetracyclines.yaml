id: zinc-supplements--tetracyclines
food: zinc-supplements
drug: tetracyclines
mechanisms: [chelation]
severity: caution
effect: decreases
summary: "Zinc taken with tetracycline antibiotics can reduce absorption of both the zinc and the antibiotic."
advice: "Take the antibiotic at least 2 hours before or 4 to 6 hours after a zinc supplement."
details: "The NIH fact sheet says tetracycline antibiotics might interact with zinc in the gut, which could inhibit absorption of both if taken together, and that the spacing above minimizes this."
citations:
  - type: "guideline"
    title: "NIH Office of Dietary Supplements: Zinc fact sheet for health professionals (Interactions with Medications)"
    url: "https://ods.od.nih.gov/factsheets/Zinc-HealthProfessional/"
status: approved
source: ods
reviewed_at: 2026-11-18
