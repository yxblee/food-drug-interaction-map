id: soy-products--levothyroxine
food: soy-products
drug: levothyroxine
mechanisms: [reduced-absorption]
severity: caution
effect: decreases
summary: "Soy foods can lower levothyroxine absorption."
advice: "Keep soy intake steady and take levothyroxine apart from soy-based foods. Tell your prescriber if your soy intake changes a lot."
details: "The Synthroid label says soybean flour can bind levothyroxine and decrease its absorption, and warns against giving it in soy-based infant formula. The systematic review reached the same direction for soy products."
