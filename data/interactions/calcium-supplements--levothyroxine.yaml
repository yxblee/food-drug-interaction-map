id: calcium-supplements--levothyroxine
food: calcium-supplements
drug: levothyroxine
mechanisms: [chelation]
severity: caution
effect: decreases
summary: "Calcium supplements can bind levothyroxine in the gut and weaken it."
advice: "Take levothyroxine at least 4 hours apart from calcium supplements, and have your thyroid levels checked if the timing changes."
details: "The Synthroid label lists calcium carbonate among agents that can bind levothyroxine and advises dosing at least 4 hours apart. The systematic review also found calcium supplements lowered absorption."
