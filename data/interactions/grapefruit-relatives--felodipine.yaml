id: grapefruit-relatives--felodipine
food: grapefruit-relatives
drug: felodipine
mechanisms: [cyp3a4-inhibition]
severity: caution
effect: increases
summary: "Grapefruit juice more than doubles felodipine levels and can lower blood pressure and speed the heart rate."
advice: "Ask your prescriber or pharmacist before having grapefruit or its relatives with felodipine. If you do, expect a stronger effect and report dizziness, a very low blood pressure reading or a racing heart."
details: "Grapefruit, pomelo and Seville orange contain furanocoumarins that switch off CYP3A4 in the gut wall, so more of the medicine is absorbed. Sweet oranges do not contain these compounds and are not part of this warning.\n\nThe felodipine label reports more than a doubling of exposure with grapefruit juice and says CYP3A4 inhibitors can cause several-fold rises, leading to a lower blood pressure and faster heart rate. It tells prescribers to use caution and take a conservative approach to dosing."
