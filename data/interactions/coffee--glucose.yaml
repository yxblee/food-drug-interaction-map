id: coffee--glucose
food: coffee
drug: glucose
mechanisms:
  - adenosine-receptor-antagonism
  - additive-stimulant
severity: monitor
effect: decreases
summary: Caffeinated coffee can worsen glucose tolerance, raising blood sugar
  and insulin after a sugar load, and can make low blood sugar feel more
  noticeable.
advice: If you monitor blood sugar or have diabetes or insulin resistance, be
  aware that caffeinated coffee near a glucose test or carbohydrate-heavy meal
  may push readings higher. Avoid it before glucose tolerance tests unless told
  otherwise. Caffeine may also bring on shaky or anxious feelings at low-normal
  glucose levels.
details: In controlled trials in healthy men, caffeinated coffee taken before an
  oral glucose tolerance test led to higher blood glucose than decaffeinated
  coffee or water. Insulin and insulin resistance were also higher, especially
  with sleep deprivation. Coffee also raised the incretin hormones GLP-1 and
  GIP, and the effect added to that of a fatty meal. In a separate clamp study,
  400 mg of caffeine increased stress hormones (epinephrine, norepinephrine,
  cortisol) and made participants notice hypoglycemic symptoms at a glucose
  level of 3.8 mmol/L, which is not normally considered low. This is consistent
  with caffeine acting through adenosine receptor blockade and sympathoadrenal
  activation.
