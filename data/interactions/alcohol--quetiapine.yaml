id: alcohol--quetiapine
food: alcohol
drug: quetiapine
mechanisms:
  - cns-depression
severity: caution
effect: increases
summary: "Alcohol can make quetiapine's effects on thinking and coordination stronger, so do not drink while taking it unless your prescriber says it is safe."
advice: "Do not drink alcohol while taking quetiapine unless your prescriber says it is safe. Avoid driving or operating machinery until you know how it affects you. Be extra careful when starting the drug or raising the dose, because drowsiness and dizziness are most common then."
details: Quetiapine acts on the central nervous system and often causes
  drowsiness, dizziness and impaired judgment. In a clinical trial in people
  with certain psychotic disorders, quetiapine increased alcohol's effects on
  thinking and motor skills. Together they can cause more sedation, slower
  reactions and a higher risk of falls. Quetiapine can also lower blood pressure
  on standing, and alcohol may add to that. The label advises limiting alcoholic
  beverages and being cautious when quetiapine is combined with other centrally
  acting substances. The MedlinePlus quetiapine page goes
  further and says not to drink alcohol while taking quetiapine.
