id: st-johns-wort--warfarin
food: st-johns-wort
drug: warfarin
mechanisms: [cyp2c9-induction, cyp3a4-induction]
severity: caution
effect: decreases
summary: "St. John's wort can lower warfarin levels and reduce its protective effect."
advice: "Do not start or stop St. John's wort without talking to your prescriber. If you do change it, expect extra INR checks."
details: "St. John's wort speeds up several liver enzymes that clear warfarin, so the blood may clot more easily than intended. The warfarin label lists St. John's wort among botanicals that can reduce warfarin's effect and calls for more frequent INR monitoring when any botanical is started or stopped. NCCIH also names warfarin among the medicines it can weaken."
