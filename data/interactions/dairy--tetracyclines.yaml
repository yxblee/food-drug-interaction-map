id: dairy--tetracyclines
food: dairy
drug: tetracyclines
mechanisms: [chelation]
severity: caution
effect: decreases
summary: "Dairy can bind tetracycline antibiotics and reduce how much you absorb."
advice: "Check the instructions for your specific antibiotic. For tetracycline itself, keep doses away from milk and dairy products."
details: "The tetracycline label says food and some dairy products interfere with absorption. The doxycycline label says tetracyclines in general are absorbed less with calcium-rich food, yet doxycycline itself is not markedly affected by food or milk, so the effect varies within the class."
