id: grapefruit--ivabradine-hydrochloride
food: grapefruit
drug: ivabradine-hydrochloride
mechanisms:
  - cyp3a4-inhibition
severity: avoid
effect: increases
summary: Grapefruit juice can raise ivabradine levels and increase the risk of a
  dangerously slow heart rate.
advice: Avoid grapefruit juice while taking ivabradine (Corlanor). Report
  dizziness, fatigue, a very slow pulse or low blood pressure to your healthcare
  provider.
details: Ivabradine is broken down mainly by the CYP3A4 enzyme in the gut and
  liver. Grapefruit juice is a moderate CYP3A4 inhibitor. It can slow this
  breakdown and raise ivabradine levels in the blood. Higher levels can worsen
  bradycardia (slow heart rate) and conduction problems. The label advises
  avoiding moderate CYP3A4 inhibitors, names grapefruit juice as an example, and
  tells patients to avoid it.
