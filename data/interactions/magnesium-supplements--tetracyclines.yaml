id: magnesium-supplements--tetracyclines
food: magnesium-supplements
drug: tetracyclines
mechanisms: [chelation]
severity: caution
effect: decreases
summary: "Magnesium can form complexes with tetracycline antibiotics that the body cannot absorb."
advice: "Take the antibiotic at least 2 hours before or 4 to 6 hours after a magnesium-containing supplement, unless your pharmacist advises otherwise."
details: "The NIH fact sheet says magnesium forms insoluble complexes with tetracyclines such as demeclocycline and doxycycline, and gives the timing above."
citations:
  - type: "guideline"
    title: "NIH Office of Dietary Supplements: Magnesium fact sheet for health professionals (Interactions with Medications)"
    url: "https://ods.od.nih.gov/factsheets/Magnesium-HealthProfessional/"
status: approved
source: ods
reviewed_at: 2026-11-18
