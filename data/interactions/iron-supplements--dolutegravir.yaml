id: iron-supplements--dolutegravir
food: iron-supplements
drug: dolutegravir
mechanisms: [chelation]
severity: caution
effect: decreases
summary: "Iron supplements can lower dolutegravir levels by about half when taken on an empty stomach."
advice: "Take dolutegravir 2 hours before or 6 hours after an iron supplement. If you take them together with a meal, the label says they can be taken at the same time. Ask your pharmacist which applies to you."
details: "The Tivicay label says that, when fasting, dolutegravir should be taken 2 hours before or 6 hours after oral supplements containing iron, and that they can be taken together with food. In a study of healthy volunteers, ferrous fumarate taken with dolutegravir on an empty stomach cut dolutegravir levels by about half (54%). Taking dolutegravir 2 hours before the iron, or taking both with a meal, counteracted this. Lower levels could weaken HIV treatment, so timing matters."
