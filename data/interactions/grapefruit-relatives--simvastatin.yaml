id: grapefruit-relatives--simvastatin
food: grapefruit-relatives
drug: simvastatin
mechanisms: [cyp3a4-inhibition]
severity: avoid
effect: increases
summary: "Grapefruit raises simvastatin levels and increases the risk of serious muscle damage."
advice: "Avoid grapefruit and grapefruit juice while taking simvastatin. Ask your pharmacist about other fruits from the same family, such as pomelo and Seville orange."
details: "Grapefruit, pomelo and Seville orange contain furanocoumarins that switch off CYP3A4 in the gut wall, so more of the medicine is absorbed. Sweet oranges do not contain these compounds and are not part of this warning.\n\nThe Zocor label says grapefruit juice can raise simvastatin levels and increase the risk of myopathy and rhabdomyolysis, and tells patients to avoid it. Rhabdomyolysis is a breakdown of muscle that can damage the kidneys."
