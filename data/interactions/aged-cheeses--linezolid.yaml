id: aged-cheeses--linezolid
food: aged-cheeses
drug: linezolid
mechanisms: [tyramine-pressor-response]
severity: caution
effect: increases
summary: "Large amounts of aged cheese can raise blood pressure while taking linezolid."
advice: "Avoid large amounts of foods high in tyramine, such as aged cheeses, fermented or air-dried meats, sauerkraut, soy sauce, tap beer and red wine, while taking linezolid."
details: "Linezolid is a reversible, non-selective MAO inhibitor, so tyramine from food is cleared more slowly. The Zyvox label reports a significant rise in blood pressure in healthy adults given linezolid with more than 100 mg of tyramine, and tells patients to avoid large amounts of high-tyramine foods."
