id: magnesium-supplements--bisphosphonates
food: magnesium-supplements
drug: bisphosphonates
mechanisms: [chelation]
severity: caution
effect: decreases
summary: "Magnesium supplements and antacids can lower absorption of oral osteoporosis pills."
advice: "Take magnesium supplements or magnesium antacids at least 2 hours before or after the osteoporosis pill."
details: "The NIH fact sheet says magnesium-rich supplements or medicines can decrease absorption of oral bisphosphonates such as alendronate, and that keeping them at least 2 hours apart minimizes this."
