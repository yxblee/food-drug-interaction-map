id: grapefruit-relatives--carbamazepine
food: grapefruit-relatives
drug: carbamazepine
mechanisms: [cyp3a4-inhibition]
severity: caution
effect: increases
summary: "Grapefruit juice can raise carbamazepine levels."
advice: "Tell your prescriber if you regularly eat grapefruit or drink grapefruit juice. Keep the amount steady, and report drowsiness, dizziness, double vision or unsteadiness."
details: "Grapefruit, pomelo and Seville orange contain furanocoumarins that switch off CYP3A4 in the gut wall, so more of the medicine is absorbed. Sweet oranges do not contain these compounds and are not part of this warning.\n\nThe Tegretol label lists grapefruit juice among substances that can increase carbamazepine blood levels, and the patient information asks about grapefruit use. Carbamazepine has a narrow safe range, so a rise can cause side effects."
