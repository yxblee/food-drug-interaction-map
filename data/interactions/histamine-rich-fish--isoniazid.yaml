id: histamine-rich-fish--isoniazid
food: histamine-rich-fish
drug: isoniazid
mechanisms: [histamine-accumulation]
severity: avoid
effect: increases
summary: "Isoniazid can make reactions to histamine-rich fish such as tuna stronger, with flushing, headache and palpitations."
advice: "Avoid histamine-rich fish such as tuna, skipjack and other tropical fish while taking isoniazid. Seek help if you get flushing, a pounding heart or a drop in blood pressure after eating fish."
details: "The isoniazid label says it may also inhibit diamine oxidase, an enzyme that breaks down histamine, leading to exaggerated reactions to histamine-containing foods. It gives skipjack, tuna and other tropical fish as examples, with headache, sweating, palpitations, flushing and low blood pressure as symptoms."
