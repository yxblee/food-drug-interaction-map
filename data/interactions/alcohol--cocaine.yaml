id: alcohol--cocaine
food: alcohol
drug: cocaine
mechanisms:
  - additive-stimulant
severity: avoid
effect: increases
summary: Drinking alcohol with cocaine produces cocaethylene, an active
  metabolite that prolongs and intensifies cocaine's euphoria and strains the
  heart.
advice: Avoid combining alcohol and cocaine. The combination is riskier than
  either substance alone, particularly for the heart. Anyone who uses both
  should seek help from a clinician or addiction service.
details: When alcohol and cocaine are taken together, the body makes
  cocaethylene, a psychoactive compound. In humans, the combination has been
  linked to stronger euphoria, a faster heart rate and higher cocaine levels in
  blood. Cocaethylene itself causes cocaine-like euphoria and cardiovascular
  effects, and it appears to clear from the body more slowly than cocaine. It
  may therefore add to the illness and death linked to combined use. Animal work
  also shows that the two drugs interact in brain systems involved in addiction.
  Studies in people also link combined use with more aggression.
