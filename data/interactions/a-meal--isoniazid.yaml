summary: "Isoniazid taken with food is absorbed much less."
advice: "The label says isoniazid should not be taken with food. Ask your pharmacist or prescriber how to time it around meals."
details: "The isoniazid label says it should not be administered with food and that studies show its bioavailability is reduced significantly when taken with food."
