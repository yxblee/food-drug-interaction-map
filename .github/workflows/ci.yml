name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: '24'
          cache: true
      - run: vp install
      - run: vp check
      - run: vp run build:db
      - run: vp test
